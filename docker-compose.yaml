services:

  # DinD: a separate Docker engine that builds and runs pipeline containers.
  # The service name "docker" is the hostname Jenkins connects to (it matches the TLS certificate).
  docker:
    image: docker:dind
    container_name: jenkins_dind
    privileged: true                        # required to run a nested Docker daemon
    environment:
      - DOCKER_TLS_CERTDIR=/certs           # enables TLS on port 2376 and generates certificates
    volumes:
      - jenkins_docker_certs:/certs/client  # TLS client certs, shared with Jenkins
      - jenkins_home:/var/jenkins_home      # lets pipeline containers mount the Jenkins workspace
      - dind-data:/var/lib/docker           # persists images and build artefacts
    ports:
      - "127.0.0.1:8081:8081"               # port for the deployed app, localhost only
    restart: unless-stopped

  # Jenkins: the CI/CD server, built from the Dockerfile in this folder
  # (stock Jenkins LTS plus the docker CLI).
  jenkins:
    build: .
    container_name: jenkins
    user: "1000:1000"                       # run as the non-root jenkins user
    environment:
      - DOCKER_HOST=tcp://docker:2376       # send Docker commands to the DinD service over TLS
      - DOCKER_CERT_PATH=/certs/client      # where the TLS client certs are mounted
      - DOCKER_TLS_VERIFY=1                 # require verified TLS
    ports:
      - "127.0.0.1:8080:8080"               # Jenkins web UI, reachable from this machine only
    volumes:
      - jenkins_home:/var/jenkins_home      # persists jobs, plugins, users and credentials
      - jenkins_docker_certs:/certs/client:ro  # TLS client certs from DinD, read-only
    restart: unless-stopped

# Named volumes managed by Docker
volumes:
  jenkins_home:
  jenkins_docker_certs:
  dind-data: